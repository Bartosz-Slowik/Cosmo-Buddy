[package]
name = "keychain-buddy"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "keychain-buddy"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"
ssd1306 = "0.10"
embedded-graphics = "0.8"
microfft = "0.6"
esp32-nimble = "0.13"

[build-dependencies]
embuild = "0.33"
